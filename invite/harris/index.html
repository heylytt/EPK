<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#100c08">
  <title>Lytt Experience | A personal invitation from LYTT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; background: #100c08; color: #fbf0dc; font: 100%/1.55 "DM Sans", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(ellipse at 50% 0, #322114 0, #100c08 58%); }
    main { width: min(100% - 2rem, 38rem); margin: auto; min-height: 100svh; padding: clamp(2rem, 7vh, 5rem) 0; text-align: center; }
    header p { margin: 0; }
    .event { color: #ebbb76; font-weight: 600; letter-spacing: .24em; font-size: .8rem; }
    h1 { margin: .8rem 0; font: 600 clamp(2.5rem, 8vw, 4.6rem)/1.04 "Playfair Display", Georgia, serif; letter-spacing: -.04em; }
    h1 em { display: block; color: #ebbb76; font-weight: 600; }
    .date { color: #e2cdb0; }
    .video { position: relative; display: grid; place-items: center; aspect-ratio: 16 / 9; margin: 1.75rem 0 1.25rem; border: 1px solid #775332; border-radius: 1rem; overflow: hidden; background: radial-gradient(ellipse at 50% 35%, #55371f, #21150e 68%, #18110c); }
    .video iframe { width: 100%; height: 100%; border: 0; }
    .video p { padding: 1rem; color: #efddc2; }
    .rsvp { display: block; padding: .9rem 1.2rem; min-height: 3rem; border-radius: .6rem; background: #ebbb76; color: #201408; font-weight: 600; text-decoration: none; }
    .rsvp[aria-disabled="true"] { background: #34261a; color: #e2cdb0; }
    footer { margin-top: 2rem; color: #ebbb76; letter-spacing: .3em; font-size: .8rem; font-weight: 600; }
    a:focus-visible { outline: 2px solid #fff0d8; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="event">Lytt Experience</p>
      <h1>Harris, <em>I saved you a seat.</em></h1>
      <p class="date"><time datetime="2026-12-28">28 December 2026</time> · An intimate live set with LYTT</p>
    </header>
    <section class="video" aria-label="Personal video invitation">
      <p>Your personal video invitation is coming soon.</p>
    </section>
    <div class="rsvp" role="button" aria-disabled="true">RSVP opens soon</div>
    <footer>LYTT</footer>
  </main>
</body>
</html>
