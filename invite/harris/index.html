<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#2b1521"><title>Lytt Experience | A personal invitation from Lytt</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 20%,#642c41,#2b1521 66%);color:#f9e8e4;font:16px/1.55 system-ui,sans-serif}
main{width:min(100% - 2rem,34rem);margin:auto;padding:clamp(2rem,7vh,5rem) 0;text-align:center}
.eyebrow{font-size:.85rem;letter-spacing:.18em;margin:0 0 1.4rem}
details{color:#431c2d}
summary{position:relative;isolation:isolate;overflow:hidden;display:grid;place-content:center;justify-items:center;gap:.65rem;min-height:15rem;padding:2rem 1rem;list-style:none;cursor:pointer;border-radius:.4rem;background:#ead3c2;box-shadow:0 22px 48px #13061066}
summary::-webkit-details-marker{display:none}
summary::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(152deg,transparent 49.6%,#ad7b7755 50%,transparent 50.4%) left/50% 100% no-repeat,linear-gradient(208deg,transparent 49.6%,#ad7b7755 50%,transparent 50.4%) right/50% 100% no-repeat}
.recipient{font:italic clamp(2.2rem,8vw,3.4rem)/1 Georgia,serif}
.seal{display:grid;place-items:center;width:3.2rem;aspect-ratio:1;border-radius:48% 51% 46% 50%;background:radial-gradient(circle at 30% 20%,#9b4258,#611e35 72%);box-shadow:inset 0 0 0 4px #f4a6b02b,0 3px 7px #4c142862;color:#ffe6d8;font:italic 1.55rem Georgia,serif}
.open{font-size:.9rem;font-weight:650}.close{display:none}details[open] .open{display:none}details[open] .close{display:inline}details[open] summary{min-height:0;padding:.75rem}details[open] summary .seal,details[open] summary .recipient{display:none}
article{margin-top:.5rem;border-radius:.35rem;background:#fff2e6;padding:clamp(1.3rem,6vw,2.8rem);text-align:left;box-shadow:0 22px 48px #13061066}
article p{margin:.65rem 0}
h1{font:normal clamp(2rem,7vw,3.35rem)/1.04 Georgia,serif;margin:.35rem 0 1rem;letter-spacing:-.045em}
.date{font-weight:700}.sign{font:italic 1.55rem Georgia,serif}
.video{margin-top:1.4rem;padding:1rem;border:1px dashed #a66478;border-radius:.5rem;background:#f5dfe0}
.video strong{display:block}.video span{font-size:.9rem}
.rsvp{margin:1rem 0 0;padding:.65rem;text-align:center;border-radius:.4rem;background:#f0d6da;font-weight:650}
summary:focus-visible{outline:3px solid #fff;outline-offset:5px}
.envelope-wrap{position:relative;isolation:isolate;margin-top:5.5rem}
.rose{position:absolute;z-index:1;right:clamp(.35rem,7vw,2.5rem);top:-5.25rem;width:7.6rem;height:9.5rem;transform:rotate(24deg);pointer-events:none}

.stem{position:absolute;left:3.77rem;top:2.9rem;width:.42rem;height:6.6rem;border-radius:100%;background:linear-gradient(90deg,#233423,#74916a,#354833)}
.leaf{position:absolute;width:2.35rem;height:1rem;background:linear-gradient(165deg,#75906a,#31442d 68%);border-radius:90% 0 90% 0}
.leaf.one{top:4.65rem;left:1.7rem;transform:rotate(27deg)}
.leaf.two{top:5.55rem;left:3.9rem;transform:rotate(-29deg)}
.bloom{position:absolute;left:1.65rem;top:.2rem;width:4.7rem;height:3.75rem;filter:drop-shadow(0 .4rem .32rem #170b1590)}
.petal{position:absolute;inset:9% 5%;border-radius:57% 45% 58% 39%;background:radial-gradient(ellipse at 40% 12%,#df929e,#a34b62 47%,#661d36 79%);box-shadow:inset 0 1px 1px #ffd6d35c}
.petal:nth-child(1){transform:rotate(-28deg)}
.petal:nth-child(2){transform:rotate(35deg) scale(.91)}
.petal:nth-child(3){inset:18% 19% 17% 15%;transform:rotate(95deg)}
.petal:nth-child(4){inset:22% 27% 22% 23%;transform:rotate(-15deg);background:radial-gradient(ellipse at 46% 15%,#ecabb3,#ad536b 54%,#70213d 82%)}
.petal:nth-child(5){inset:32% 36% 29% 35%;transform:rotate(52deg)}

/* The upper flap meets the lower folds behind the wax seal. */
details:not([open]) summary::before {
  background: #a56f70;
  clip-path: polygon(0 0, 50% 57%, 100% 0, 100% 1%, 50% 58%, 0 1%);
}
details:not([open]) summary::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: #ac777870;
  clip-path: polygon(0 100%, 36% 47%, 37% 48%, 1% 100%, 99% 100%, 63% 48%, 64% 47%, 100% 100%);
}

.eyebrow { font: italic clamp(2.55rem, 9vw, 4.4rem)/1.05 Georgia, serif; letter-spacing: -.06em; margin-bottom: 1rem; color: #fff1e6; text-shadow: 0 .2rem 1rem #25101b88; }
.eyebrow span { color: #f5b6bd; }
.envelope-wrap { margin-top: 0; padding-top: 5.5rem; }
.rose { right: clamp(.6rem, 8vw, 2.6rem); top: 0; z-index: 2; transform: rotate(19deg) scale(1.12); }
.bloom { filter: drop-shadow(0 .35rem .3rem #190912bb); }
article { box-shadow: inset 0 22px 26px -18px #6e3f48c9, 0 22px 48px #13061066; }
</style></head>
<body><main>
<p class="eyebrow">Lytt <span>Experience</span></p>
<div class="envelope-wrap">
<span class="rose" aria-hidden="true"><span class="stem"></span><span class="leaf one"></span><span class="leaf two"></span><span class="bloom"><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span></span></span>
<details>
<summary><span class="recipient">For Harris</span><span class="seal" aria-hidden="true">L</span><span class="open">Open your invitation</span><span class="close">Close invitation</span></summary>
<article>
<p class="date"><time datetime="2026-12-28">28 December 2026</time></p>
<h1>Harris, I saved you a seat.</h1>
<p>I’d love to have you there for a small live set. I’ll share some songs from <em>Rose &amp; Promises</em> and a few stories behind them.</p>
<p class="sign">Lytt</p>
<div class="video"><strong>A personal video for you</strong><span>Coming soon</span></div>
<p class="rsvp">RSVP opens soon</p>
</article>
</details>
</div>
</main></body></html>
